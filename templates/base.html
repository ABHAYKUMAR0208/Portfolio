<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Abhay's Portfolio{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Bootstrap & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  
  <!-- Custom Style -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    body {
      background: #0d0d1f;
      color: #ffffff;
      font-family: 'Segoe UI', sans-serif;
    }
    .navbar {
      background-color: #1a1a2e;
      box-shadow: 0 0 15px #00ffff33;
    }
    .navbar-brand, .nav-link {
      color: #00ffff !important;
      font-weight: 600;
    }
    .nav-link:hover {
      color: #00bcd4 !important;
    }
    footer {
      background-color: #1a1a2e;
      color: #bbb;
      font-size: 0.9rem;
    }
    .section-title {
      color: #00ffff;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      position: relative;
    }
 
      .hover-scale {
    border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
    transition: all 0.4s ease-in-out;
  }

  .hover-scale:hover {
    transform: scale(1.05);
    border-radius: 50%; /* This makes it circular on hover */
  }

  .hover-scale {
    border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
    transition: all 0.4s ease-in-out;
    padding: 10px;
    display: inline-block;
  }

  .hover-scale:hover {
    border-radius: 50%;
    transform: scale(1.05);
  }

  .hover-scale img {
    border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
    transition: all 0.4s ease-in-out;
  }

  .hover-scale:hover img {
    border-radius: 50%; /* Apply circular border to the image itself */
  }
  .carousel-item {
    transition: transform 0.4s ease-in-out; /* default is ~0.6s, you can reduce it */
  }

  
</style>
</head>

<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg px-4">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">Abhay Kumar</a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-label="Toggle navigation">
  <svg width="30" height="30" viewBox="0 0 30 30" xmlns="http://www.w3.org/2000/svg">
    <rect y="6" width="30" height="3" fill="white" />
    <rect y="13.5" width="30" height="3" fill="white" />
    <rect y="21" width="30" height="3" fill="white" />
  </svg>
</button>


      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
          <li class="nav-item"><a class="nav-link" href="/projects">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="/contact">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="container my-5">
    {% block content %}{% endblock %}
  </div>

  <!-- Footer -->
  <footer class="text-center py-3">
    <p>&copy; 2025 Abhay Kumar • Built with Flask</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
